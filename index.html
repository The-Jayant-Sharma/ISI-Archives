<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISI Archives</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --search-bg: #f5f5f5;
            --text-main: #000000;
            --text-dim: #888888;
        }

        /* Restrict View & Prevent Horizontal Scroll */
        html, body {
            overflow-x: hidden;
            width: 100vw;
            position: relative;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        /* Precision Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
            padding: 2rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .search-wrapper {
            width: 240px; /* Even tighter for focus */
            background: var(--search-bg);
            border-radius: 100px;
            padding: 0.1rem 1rem;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .search-input {
            background: transparent;
            border: none;
            width: 100%;
            padding: 0.6rem;
            font-size: 0.7rem;
            outline: none !important;
            text-align: center;
            color: #000;
        }

        /* Centered Content Window */
        .main-content {
            width: 100%;
            padding-top: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 10rem;
        }

        .book-list {
            width: 100%;
            max-width: 100%; /* Restrict to device width */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Intense Entrance Animation */
        .book-entry {
            width: 100%;
            padding: 6rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(60px) scale(0.95); /* Intense travel + scale */
            transition: all 1.1s cubic-bezier(0.19, 1, 0.22, 1); /* High-end ease-out */
            will-change: transform, opacity;
        }

        .book-entry.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .separator {
            width: 30px;
            height: 1px;
            background-color: #000;
            margin: 0 auto;
            opacity: 0.1;
        }

        .book-title {
            font-weight: 800;
            font-size: clamp(1.2rem, 5vw, 1.8rem); /* Responsive text sizing */
            letter-spacing: -0.05em;
            margin-bottom: 1.2rem;
            line-height: 1.1;
            max-width: 90%;
        }

        .detail-line {
            display: block;
            color: var(--text-dim);
            font-size: 0.65rem;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* The Pill Button */
        .btn-download {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 12px 50px;
            margin-top: 2.5rem;
            border-radius: 100px;
            font-weight: 500;
            font-size: 9px;
            text-transform: uppercase;
            text-decoration: none !important;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .btn-download:hover {
            transform: scale(1.05);
            background: #222;
        }

        /* Loading Bar Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .load-line {
            width: 60px;
            height: 2px;
            background: #000;
            animation: line-grow 1s infinite alternate cubic-bezier(0.19, 1, 0.22, 1);
        }
        @keyframes line-grow { 
            0% { transform: scaleX(0.2); opacity: 0.2; } 
            100% { transform: scaleX(1); opacity: 1; } 
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="load-line"></div>
    </div>

    <header>
        <div class="header-title">ISI Archives</div>
        <div class="search-wrapper">
            <input 
                type="text" 
                id="search-bar" 
                placeholder="TYPE TO SEARCH..." 
                class="search-input"
            >
        </div>
    </header>

    <main class="main-content">
        <div id="books" class="book-list">
            </div>
    </main>

    <script>
        const searchInput = document.getElementById('search-bar');
        const listContainer = document.getElementById('books');
        const loader = document.getElementById('loader');
        let database = [];

        // Intense Scroll Observer
        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.15 });

        const formatText = (val) => (val && String(val).trim() !== "") ? val : "N/A";

        async function init() {
            try {
                const res = await fetch('JSON/structure.json');
                database = await res.json();
                render(database);
            } catch (e) {
                listContainer.innerHTML = `<div class="py-20 text-[10px] opacity-20">SYSTEM_OFFLINE</div>`;
            } finally {
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 600);
                }, 1200);
            }
        }

        function render(data) {
            listContainer.innerHTML = '';
            if (data.length === 0) {
                listContainer.innerHTML = `<div class="py-20 opacity-10 text-[8px] tracking-[1em]">VOID</div>`;
                return;
            }

            data.forEach((book, index) => {
                const entry = document.createElement('div');
                entry.className = "book-entry";
                entry.innerHTML = `
                    <h2 class="book-title uppercase">${formatText(book.title)}</h2>
                    <span class="detail-line">AUTHOR: ${formatText(book.writer)}</span>
                    <span class="detail-line">EDITION: ${formatText(book.edition)}</span>
                    <a href="${book.download_address || '#'}" class="btn-download">Download</a>
                `;
                
                listContainer.appendChild(entry);
                scrollObserver.observe(entry);
                
                if (index < data.length - 1) {
                    const sep = document.createElement('div');
                    sep.className = "separator";
                    listContainer.appendChild(sep);
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = database.filter(b => (b.title || "").toLowerCase().includes(query));
            render(filtered);
            // Instant return to top to see new results animate in
            window.scrollTo({ top: 0, behavior: 'auto' });
        });

        init();
    </script>
</body>
  </html>
